<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131316">
<title>CAB Voting</title>
<!-- Built for a packed arena: one small file, nothing else to download, two calls per voter. -->
<style>
:root { --bg:#131316; --card:#1c1c22; --inset:#111115; --line:#2a2a31; --text:#fff; --muted:#a1a1aa; --accent:#8b5cf6; --blue:#2563eb; --ok:#4ade80; --bad:#f87171; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); color-scheme: dark; }
body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 520px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
.top { color: var(--muted); font-size: 13px; font-weight: 600; margin: 0 4px 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
.body { padding: 24px 20px; }
.banner { display: block; width: 100%; height: auto; }
h1 { margin: 0 0 6px; font-size: 24px; line-height: 1.2; }
.intro { color: var(--muted); margin: 0 0 4px; white-space: pre-line; }
label, .lbl { display: block; color: var(--muted); font-size: 13px; font-weight: 600; margin: 20px 0 8px; }
input { width: 100%; height: 54px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--inset); color: var(--text); font-family: inherit; font-size: 20px; font-weight: 600; text-align: center; letter-spacing: .04em; outline: none; }
input:focus { border-color: #52525b; }
input.email { font-size: 17px; letter-spacing: 0; }
input::placeholder { color: #52525b; font-weight: 500; font-size: 16px; letter-spacing: 0; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; margin-bottom: 8px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--inset); color: var(--text); font: inherit; text-align: left; cursor: pointer; touch-action: manipulation; }
.opt .n { width: 32px; height: 32px; flex-shrink: 0; border-radius: 9px; background: #26262d; color: var(--muted); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
.opt img { width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; object-fit: cover; background: #26262d; }
.opt .t { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; line-height: 1.25; }
.opt .t small { display: block; color: var(--muted); font-weight: 500; font-size: 13px; }
.opt .c { width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; border: 2px solid #3f3f46; }
.opt.on { border-color: var(--accent); background: #221b33; }
.opt.on .n, .opt.on .c { background: var(--accent); border-color: var(--accent); color: #fff; }
.opt.on .c { box-shadow: inset 0 0 0 4px #221b33; }
.btn { display: block; width: 100%; margin-top: 16px; padding: 16px; border: 0; border-radius: 999px; background: var(--blue); color: #fff; font-family: inherit; font-size: 17px; font-weight: 700; line-height: 1; cursor: pointer; touch-action: manipulation; }
.btn:disabled { opacity: .45; }
.btn.alt { background: transparent; border: 1px solid #3f3f46; color: var(--text); font-weight: 600; }
.err { color: var(--bad); font-size: 14px; font-weight: 600; text-align: center; min-height: 21px; margin-top: 10px; }
.state { text-align: center; padding: 40px 22px; }
.state .i { font-size: 44px; line-height: 1; margin-bottom: 14px; }
.state h2 { margin: 0 0 8px; font-size: 22px; }
.state p { color: var(--muted); margin: 0; white-space: pre-line; }
.picks { list-style: none; margin: 18px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 14px; text-align: left; }
.picks li { padding: 11px 14px; font-weight: 700; border-top: 1px solid var(--line); }
.picks li:first-child { border-top: 0; }
.foot { text-align: center; color: #52525b; font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top">Canyon Activities Board</div>
  <div class="card" id="app"><div class="state"><p>Loading…</p></div></div>
  <div class="foot">© Canyon Activities Board</div>
</div>
<script>
// Same Supabase project as VIP Check In. Plain fetch — no library to download.
var API = 'https://raraxpjsftqxhwkpwpab.supabase.co/rest/v1/rpc/';
var KEY = 'sb_publishable_p4FqN3nJTT5GFNU_xqZtYg_7fPtkKhS';
var SLUG = (new URLSearchParams(location.search).get('f') || '').trim().toLowerCase();
var app = document.getElementById('app');
var form = null, picked = [], sending = false, waitTimer = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function url(u) { return /^https:\/\//i.test(u || '') ? u : ''; }
function $(id) { return document.getElementById(id); }

// One database call. Network trouble / server busy -> { retry: true }.
function call(fn, body) {
  var ctl = window.AbortController ? new AbortController() : null;
  var t = setTimeout(function () { if (ctl) ctl.abort(); }, 12000);
  return fetch(API + fn, {
    method: 'POST',
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    signal: ctl ? ctl.signal : undefined
  }).then(function (r) {
    clearTimeout(t);
    if (r.status >= 500 || r.status === 429) return { retry: true };
    if (!r.ok) return { failed: true };
    return r.json();
  }, function () { clearTimeout(t); return { retry: true }; });
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function state(icon, title, msg, extra) {
  app.innerHTML = '<div class="state"><div class="i">' + icon + '</div><h2>' + esc(title) + '</h2><p>' + esc(msg) + '</p>' + (extra || '') + '</div>';
}

// ── Load the form (call 1) ─────────────────────────────────
function load() {
  clearTimeout(waitTimer);
  if (!SLUG) return state('🔗', 'Voting page not found', 'This link is missing the voting form. Check the link or QR code.');
  return call('voting_form_public', { p_slug: SLUG }).then(function (d) {
    if (!d || d.retry || d.failed) { if (!form) state('📶', 'Connecting…', 'The network is busy. Trying again…'); return wait(3000 + Math.random() * 4000); }
    if (d.state === 'missing') return state('🔗', 'Voting page not found', 'This voting form doesn\'t exist. Check the link or QR code.');
    form = d;
    document.title = d.title + ' · CAB Voting';
    $('top').textContent = d.event_name || 'Canyon Activities Board';
    if (d.state === 'sms') return state('💬', 'Vote by text', d.closed_message || 'This vote happens by text message. Use the number and keyword on screen.');
    if (d.state === 'open') return showBallot();
    var msg = d.state === 'not_yet'
      ? 'Voting opens ' + new Date(d.opens_at).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }) + '.\nKeep this page open — it opens by itself.'
      : (d.closed_message || 'Voting isn\'t open right now.\nKeep this page open — it opens by itself.');
    state(d.state === 'not_yet' ? '⏳' : '🔒', d.state === 'not_yet' ? 'Voting opens soon' : 'Voting is closed', msg,
      '<button class="btn alt" onclick="load()">Check again</button>');
    wait(30000 + Math.random() * 15000);
  });
}
// While closed, check rarely (6,000 phones add up), and right away when the phone wakes up.
function wait(ms) { clearTimeout(waitTimer); waitTimer = setTimeout(load, ms); }
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && waitTimer && form && form.state !== 'open') load();
});

// ── Who is voting ──────────────────────────────────────────
// Student ID forms ask for an ID, email forms for an email, open forms nothing (one vote per phone).
function mode() { return form.voter_check || 'roster'; }
function asksEmail() { return mode() === 'email' || mode() === 'guest_list'; }
function asksId() { return mode() !== 'open'; }
function idLabel() { return asksEmail() ? 'Email' : (form.id_label || 'Student ID'); }
function deviceId() {
  var id = null;
  try { id = localStorage.getItem('cab_vote_device'); } catch (e) {}
  if (!id || !/^[a-z0-9-]{8,64}$/.test(id)) {
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2));
    id = id.toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 64);
    try { localStorage.setItem('cab_vote_device', id); } catch (e) {}
  }
  return id;
}

// ── Ballot: ID + choices on one screen ──────────────────────
function maxPicks() { return Math.max(1, Math.min(form.max_choices || 1, form.candidates.length || 1)); }

function showBallot(err) {
  clearTimeout(waitTimer); waitTimer = null;
  var max = maxPicks(), label = idLabel();
  var id = $('vid') ? $('vid').value : '', code = $('vcode') ? $('vcode').value : '';
  var banner = url(form.banner_url);
  app.innerHTML = (banner ? '<img class="banner" src="' + esc(banner) + '" alt="">' : '') +
    '<div class="body"><h1>' + esc(form.title) + '</h1>' + (form.intro ? '<p class="intro">' + esc(form.intro) + '</p>' : '') +
    (!asksId() ? '' : asksEmail()
      ? '<label for="vid">Email</label><input id="vid" class="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="200" placeholder="you@example.com">'
      : '<label for="vid">' + esc(label) + '</label><input id="vid" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40" placeholder="Enter your ' + esc(label) + '">') +
    (form.needs_code ? '<label for="vcode">Access code</label><input id="vcode" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="Enter the code">' : '') +
    '<div class="lbl">' + (max > 1 ? 'Pick up to ' + max : 'Pick one') + '</div>' +
    form.candidates.map(function (c, i) {
      var img = url(c.image_url);
      return '<button type="button" class="opt" data-id="' + esc(c.id) + '" aria-pressed="false" onclick="pick(this)">' +
        (img ? '<img src="' + esc(img) + '" alt="" loading="lazy">' : '<span class="n">' + (i + 1) + '</span>') +
        '<span class="t">' + esc(c.name) + (c.subtitle ? '<small>' + esc(c.subtitle) + '</small>' : '') + '</span><span class="c"></span></button>';
    }).join('') +
    '<button class="btn" id="go" onclick="vote()">Vote</button><div class="err" id="err">' + esc(err || '') + '</div></div>';
  ['vid', 'vcode'].forEach(function (k) {
    if (!$(k)) return;
    $(k).value = k === 'vid' ? id : code;
    $(k).addEventListener('input', function () { $('err').textContent = ''; sync(); });
  });
  sync();
}

function pick(el) {
  var id = el.getAttribute('data-id'), max = maxPicks(), at = picked.indexOf(id);
  if (at >= 0) picked.splice(at, 1);
  else if (max === 1) picked = [id];
  else if (picked.length < max) picked.push(id);
  else { $('err').textContent = 'You can pick up to ' + max + '. Tap one to unselect it.'; return; }
  $('err').textContent = '';
  sync();
}

function sync() {
  var opts = app.querySelectorAll('.opt');
  for (var i = 0; i < opts.length; i++) {
    var on = picked.indexOf(opts[i].getAttribute('data-id')) >= 0;
    opts[i].className = on ? 'opt on' : 'opt';
    opts[i].setAttribute('aria-pressed', on);
  }
  $('go').disabled = sending || !picked.length || ($('vid') && !$('vid').value.trim()) || ($('vcode') && !$('vcode').value.trim());
  $('go').textContent = sending ? 'Sending…' : (picked.length > 1 ? 'Vote for ' + picked.length : 'Vote');
}

// ── Cast the vote (call 2) ─────────────────────────────────
// The database checks the ID, the picks and double votes in this one call.
function vote() {
  var voter = asksId() ? $('vid').value.trim() : 'device:' + deviceId(), label = idLabel();
  var code = $('vcode') ? $('vcode').value.trim() : null;
  if (sending || !voter || !picked.length) return;
  sending = true; sync(); $('err').textContent = '';
  var unsure = false, tries = 0;
  (function attempt() {
    call('cast_vote', { p_slug: SLUG, p_voter: voter, p_choices: picked, p_code: code }).then(function (d) {
      if (d && d.retry && tries < 4) {          // dropped / busy: try again, backing off
        unsure = true; tries++;
        $('err').textContent = 'Network is busy — still sending…';
        return sleep(800 * tries + Math.random() * 800).then(attempt);
      }
      sending = false;
      if (!d || d.retry || d.failed) { sync(); $('err').textContent = 'Couldn\'t send your vote. Check your signal and tap Vote again.'; return; }
      // A retry that hits "already" means an earlier try got through
      if (d.ok || (d.error === 'already' && unsure)) return done();
      if (d.error === 'already') return asksId()
        ? state('✅', 'Already voted', voter + ' has already voted. Thanks!', '<button class="btn alt" onclick="again()">Use a different ' + esc(label) + '</button>')
        : state('✅', 'Already voted', 'This phone has already voted. Thanks!');
      if (d.error === 'code') { sync(); $('err').textContent = 'That access code isn\'t right.'; $('vcode').focus(); return; }
      if (d.error === 'not_on_list' || d.error === 'id') {
        sync();
        $('err').textContent = d.error === 'id' && asksEmail() ? 'Enter a valid email address.'
          : mode() === 'guest_list' ? 'That email isn\'t on the VIP guest list. Use the email you registered with.'
          : 'That ' + label + ' can\'t vote. Double-check it.';
        if ($('vid')) $('vid').focus();
        return;
      }
      if (d.error === 'closed') { picked = []; return load(); }
      picked = []; form = null; return load();   // options changed — reload them
    });
  })();
}

function done() {
  var names = picked.map(function (id) { for (var i = 0; i < form.candidates.length; i++) if (form.candidates[i].id === id) return form.candidates[i].name; return ''; });
  state('🎉', 'Vote confirmed!', form.success_message || 'Your vote is in. Enjoy the show!',
    '<ul class="picks">' + names.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>');
}
function again() { picked = []; showBallot(); }

load();
</script>
</body>
</html>
