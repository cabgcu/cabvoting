<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131316" />
    <title>CAB Voting</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/wR5HGeC.png" />
    <link rel="apple-touch-icon" href="https://i.imgur.com/wR5HGeC.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --app-bg: #131316; --card-bg: rgba(28, 28, 34, 0.68); --solid-bg: #1c1c22; --inset-bg: rgba(12, 12, 16, 0.45); --highlight-bg: rgba(255, 255, 255, 0.1);
            --accent-blue: #2563eb; --accent-blue-hover: #1d4ed8; --accent-purple: #8b5cf6;
            --text-main: #fff; --text-muted: #9ca3af; --text-dim: #71717a;
            --line: rgba(39, 39, 42, 0.8); --line-strong: #3f3f46;
            --success-text: #4ade80; --success-bg: rgba(74, 222, 128, 0.1);
            --warning-text: #fbbf24; --warning-bg: rgba(251, 191, 36, 0.1);
            --danger-text: #f87171; --danger-bg: rgba(248, 113, 113, 0.1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html { background: var(--app-bg); color-scheme: dark; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: var(--font); font-size: 15px; color: var(--text-main); background: transparent; -webkit-font-smoothing: antialiased; }
        #bg-container {
            position: fixed; top: 0; left: 0; right: 0; z-index: -1; pointer-events: none;
            height: 100vh; height: 100lvh;
            background: #131316 url('https://i.imgur.com/APGH0Wv.png') center / cover no-repeat;
        }
        #bg-container::after { content: ''; position: absolute; inset: 0; background: rgba(19, 19, 22, 0.25); }
        .wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; padding-top: calc(32px + env(safe-area-inset-top)); }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .brand img { height: 34px; }
        .brand .t { font-weight: 700; font-size: 15px; }
        .brand .s { color: var(--text-muted); font-size: 13px; }

        .card { background: var(--card-bg); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
        .card-body { padding: 28px; }
        .banner { display: block; width: 100%; height: auto; }
        .eyebrow { display: inline-block; font-size: 12px; font-weight: 600; color: #c4b5fd; background: rgba(139, 92, 246, 0.12); padding: 4px 10px; border-radius: 6px; margin-bottom: 12px; }
        h1 { margin: 0 0 10px; font-size: 26px; font-weight: 700; line-height: 1.2; }
        .intro { color: var(--text-muted); line-height: 1.6; margin: 0 0 8px; white-space: pre-line; }
        .section-title { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin: 24px 0 12px; display: flex; justify-content: space-between; gap: 10px; }
        .section-title span:last-child { color: var(--text-muted); text-transform: none; letter-spacing: 0; font-weight: 500; }

        label { display: block; color: var(--text-muted); font-size: 13px; font-weight: 500; margin-bottom: 6px; }
        input {
            width: 100%; background: var(--inset-bg); border: 1px solid var(--line); color: #fff;
            height: 54px; padding: 0 16px; border-radius: 14px; font: 600 20px var(--font); letter-spacing: 0.04em; outline: none; transition: border-color 0.15s; text-align: center;
        }
        input:focus { border-color: #52525b; }
        input::placeholder { color: var(--text-dim); font-weight: 500; letter-spacing: 0; font-size: 16px; }

        .btn { background: var(--accent-blue); color: #fff; border: none; border-radius: 9999px; padding: 15px 22px; font: 600 16px var(--font); cursor: pointer; transition: background 0.15s, transform 0.1s, opacity 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; touch-action: manipulation; }
        .btn:hover { background: var(--accent-blue-hover); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .link { background: none; border: none; color: #60a5fa; font: 500 14px var(--font); cursor: pointer; padding: 12px; display: block; margin: 8px auto 0; }

        .cands { display: flex; flex-direction: column; gap: 10px; }
        .cand {
            display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
            background: var(--inset-bg); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px;
            color: #fff; font: inherit; cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.1s; touch-action: manipulation;
            animation: rise 0.35s both;
        }
        .cand:active { transform: scale(0.99); }
        .cand .num { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; background: rgba(255,255,255,0.06); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: var(--text-muted); transition: 0.15s; }
        .cand .pic { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; flex-shrink: 0; background: var(--solid-bg); }
        .cand .info { flex: 1; min-width: 0; }
        .cand .name { font-weight: 700; font-size: 17px; line-height: 1.25; }
        .cand .sub { color: var(--text-muted); font-size: 13px; margin-top: 2px; }
        .cand .tick { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line-strong); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: 0.15s; }
        .cand .tick svg { width: 13px; height: 13px; fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(0.5); transition: 0.15s; }
        .cand.on { border-color: var(--accent-purple); background: rgba(139, 92, 246, 0.12); }
        .cand.on .num { background: var(--accent-purple); border-color: transparent; color: #fff; }
        .cand.on .tick { background: var(--accent-purple); border-color: var(--accent-purple); }
        .cand.on .tick svg { opacity: 1; transform: scale(1); }
        .cand.full { opacity: 0.55; }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .shake { animation: shake 0.3s; }
        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        .submit-bar { position: sticky; bottom: 0; padding: 16px 0 calc(4px + env(safe-area-inset-bottom)); margin-top: 8px; background: linear-gradient(to bottom, transparent, rgba(19,19,22,0.9) 30%); }

        .state { text-align: center; padding: 44px 28px; }
        .state .icon { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; }
        .state .icon svg { width: 32px; height: 32px; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .state .icon.ok { background: var(--success-bg); } .state .icon.ok svg { stroke: var(--success-text); }
        .state .icon.wait { background: var(--warning-bg); } .state .icon.wait svg { stroke: var(--warning-text); }
        .state .icon.no { background: var(--danger-bg); } .state .icon.no svg { stroke: var(--danger-text); }
        .state h2 { margin: 0 0 10px; font-size: 22px; }
        .state p { color: var(--text-muted); line-height: 1.6; margin: 0 auto; max-width: 420px; white-space: pre-line; }
        .picks { list-style: none; padding: 0; margin: 20px auto 0; max-width: 360px; text-align: left; background: var(--inset-bg); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
        .picks li { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
        .picks li:last-child { border-bottom: none; }
        .pop { animation: pop 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
        @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }

        .error { color: var(--danger-text); font-size: 14px; font-weight: 500; margin-top: 12px; min-height: 1.3em; text-align: center; }
        .spinner { width: 28px; height: 28px; margin: 60px auto; border: 3px solid rgba(255,255,255,0.12); border-top-color: var(--accent-purple); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 24px; }
        @media (max-width: 560px) {
            .card-body { padding: 22px 18px; }
            h1 { font-size: 23px; }
        }
        @media (prefers-reduced-motion: reduce) { .cand, .pop, .shake { animation: none; } }
    </style>
</head>
<body>
<div id="bg-container"></div>
<div class="wrap">
    <div class="brand">
        <img src="https://i.imgur.com/p2qZOL5.png" alt="CAB">
        <div><div class="t">Canyon Activities Board</div><div class="s" id="brandSub">Voting</div></div>
    </div>
    <div class="card" id="app"><div class="spinner"></div></div>
    <div class="footer">© Canyon Activities Board</div>
</div>

<script>
    // Same Supabase project as VIP Check In
    const SUPABASE_URL = 'https://raraxpjsftqxhwkpwpab.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_p4FqN3nJTT5GFNU_xqZtYg_7fPtkKhS';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

    const params = new URLSearchParams(location.search);
    const SLUG = (params.get('f') || params.get('form') || '').trim().toLowerCase();
    const app = document.getElementById('app');

    let form = null;          // what voting_form_public returned
    let voterId = '';
    let picked = [];          // candidate ids, in the order tapped
    let pollTimer = null;
    let busy = false;

    const ICONS = {
        ok: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
        wait: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>',
        lock: '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
        no: '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
    };
    const TICK = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function fmtWhen(iso) { return new Date(iso).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
    function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }
    function buzz() { try { navigator.vibrate && navigator.vibrate(10); } catch (e) {} }

    function header() {
        const banner = safeUrl(form?.banner_url);
        return `${banner ? `<img class="banner" src="${escapeHtml(banner)}" alt="">` : ''}`;
    }
    function titleBlock() {
        return `${form.event_name ? `<div class="eyebrow">${escapeHtml(form.event_name)}</div>` : ''}
                <h1>${escapeHtml(form.title)}</h1>
                ${form.intro ? `<p class="intro">${escapeHtml(form.intro)}</p>` : ''}`;
    }

    function showState(kind, title, message, extra = '') {
        app.innerHTML = `${header()}<div class="state"><div class="icon ${kind === 'lock' ? 'no' : kind} pop">${ICONS[kind]}</div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(message)}</p>${extra}</div>`;
    }

    // ── load ───────────────────────────────────────────────────
    async function load(quiet = false) {
        if (!SLUG) { showState('no', 'Voting page not found', 'This link is missing the voting form. Check the link or QR code and try again.'); return; }
        const { data, error } = await _supabase.rpc('voting_form_public', { p_slug: SLUG });
        if (error || !data) {
            if (!quiet) showState('wait', 'Connecting…', 'The connection is busy. Retrying in a moment…');
            schedulePoll(4000);
            return;
        }
        form = data;
        if (form.state === 'missing') { showState('no', 'Voting page not found', 'This voting form doesn\'t exist anymore. Check the link or QR code.'); return; }
        document.title = form.title + ' · CAB Voting';
        document.getElementById('brandSub').innerText = form.event_name || 'Voting';
        if (form.state === 'open') {
            stopPoll();
            if (!quiet || !app.dataset.step) renderIdStep();
        } else {
            renderClosed();
            schedulePoll();   // opens by itself when staff open voting
        }
    }

    function renderClosed() {
        app.dataset.step = '';
        if (form.state === 'not_yet') {
            showState('wait', 'Voting opens soon', `Voting opens ${fmtWhen(form.opens_at)}. Keep this page open — it will open by itself.`);
        } else {
            showState('lock', 'Voting is closed', form.closed_message || 'Voting is closed right now. Stay tuned for the winners!');
        }
    }

    function schedulePoll(ms) {
        stopPoll();
        pollTimer = setTimeout(() => load(true), ms || 12000 + Math.random() * 6000);
    }
    function stopPoll() { if (pollTimer) clearTimeout(pollTimer); pollTimer = null; }

    // ── step 1: ID ─────────────────────────────────────────────
    function renderIdStep(message = '') {
        app.dataset.step = 'id';
        const label = form.id_label || 'Student ID';
        app.innerHTML = `${header()}
            <div class="card-body">
                ${titleBlock()}
                <div style="margin-top:22px;">
                    <label for="voterId">${escapeHtml(label)}</label>
                    <input id="voterId" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40" placeholder="Enter your ${escapeHtml(label)}" value="${escapeHtml(voterId)}">
                </div>
                <div style="margin-top:16px;"><button class="btn" id="idBtn" onclick="checkId()">Continue</button></div>
                <div class="error" id="idError">${escapeHtml(message)}</div>
            </div>`;
        const input = document.getElementById('voterId');
        const btn = document.getElementById('idBtn');
        const sync = () => { btn.disabled = input.value.trim().length < 1; };
        input.addEventListener('input', () => { sync(); document.getElementById('idError').innerText = ''; });
        input.addEventListener('keydown', e => { if (e.key === 'Enter' && !btn.disabled) checkId(); });
        sync();
    }

    async function checkId() {
        if (busy) return;
        const input = document.getElementById('voterId');
        const btn = document.getElementById('idBtn');
        const err = document.getElementById('idError');
        voterId = input.value.trim();
        if (!voterId) return;
        busy = true;
        btn.disabled = true;
        btn.innerText = 'Checking…';
        err.innerText = '';
        const { data, error } = await _supabase.rpc('voting_check_voter', { p_slug: SLUG, p_voter: voterId });
        busy = false;
        btn.disabled = false;
        btn.innerText = 'Continue';
        if (error || !data) { err.innerText = 'Connection is weak. Please try again.'; return; }
        if (data.ok) { picked = []; renderBallot(); return; }
        const label = (form.id_label || 'Student ID');
        if (data.error === 'already') {
            showState('ok', 'You\'ve already voted', `${label} ${voterId} has already voted. Thanks for being part of it!`, `<button class="link" onclick="voterId=''; renderIdStep()">Use a different ${escapeHtml(label)}</button>`);
        } else if (data.error === 'not_on_list') {
            err.innerText = `That ${label} isn't eligible to vote. Double-check it and try again.`;
            input.focus(); input.select();
        } else if (data.error === 'closed') {
            await load();
        } else {
            err.innerText = `Enter a valid ${label}.`;
        }
    }

    // ── step 2: ballot ─────────────────────────────────────────
    function maxPicks() { return Math.max(1, Math.min(form.max_choices || 1, form.candidates.length || 1)); }

    function renderBallot(message = '') {
        app.dataset.step = 'ballot';
        const max = maxPicks();
        app.innerHTML = `${header()}
            <div class="card-body">
                ${titleBlock()}
                <div class="section-title"><span>${max > 1 ? `Pick up to ${max}` : 'Pick one'}</span><span id="pickCount"></span></div>
                <div class="cands" id="cands">
                    ${form.candidates.map((c, i) => {
                        const pic = safeUrl(c.image_url);
                        return `<button type="button" class="cand" data-id="${escapeHtml(c.id)}" aria-pressed="false" style="animation-delay:${Math.min(i, 12) * 0.04}s" onclick="toggleCand(this)">
                            ${pic ? `<img class="pic" src="${escapeHtml(pic)}" alt="" loading="lazy">` : `<span class="num">${i + 1}</span>`}
                            <span class="info"><span class="name" style="display:block;">${escapeHtml(c.name)}</span>${c.subtitle ? `<span class="sub" style="display:block;">${escapeHtml(c.subtitle)}</span>` : ''}</span>
                            <span class="tick">${TICK}</span>
                        </button>`;
                    }).join('')}
                </div>
                <div class="submit-bar">
                    <button class="btn" id="voteBtn" onclick="submitVote()" disabled>Cast my vote</button>
                    <div class="error" id="voteError">${escapeHtml(message)}</div>
                </div>
                <button class="link" onclick="renderIdStep()">← Change ${escapeHtml(form.id_label || 'Student ID')}</button>
            </div>`;
        syncBallot();
    }

    function toggleCand(el) {
        const id = el.dataset.id;
        const max = maxPicks();
        if (picked.includes(id)) picked = picked.filter(x => x !== id);
        else if (max === 1) picked = [id];
        else if (picked.length >= max) {
            el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
            document.getElementById('voteError').innerText = `You can pick up to ${max}. Tap one to unselect it first.`;
            return;
        } else picked.push(id);
        buzz();
        document.getElementById('voteError').innerText = '';
        syncBallot();
    }

    function syncBallot() {
        const max = maxPicks();
        document.querySelectorAll('.cand').forEach(el => {
            const on = picked.includes(el.dataset.id);
            el.classList.toggle('on', on);
            el.setAttribute('aria-pressed', on);
            el.classList.toggle('full', max > 1 && !on && picked.length >= max);
        });
        const btn = document.getElementById('voteBtn');
        btn.disabled = picked.length === 0;
        btn.innerText = max > 1 && picked.length > 1 ? `Cast my ${picked.length} votes` : 'Cast my vote';
        document.getElementById('pickCount').innerText = max > 1 ? `${picked.length} of ${max} picked` : '';
    }

    async function submitVote() {
        if (busy || !picked.length) return;
        const btn = document.getElementById('voteBtn');
        const err = document.getElementById('voteError');
        busy = true;
        btn.disabled = true;
        btn.innerText = 'Sending…';
        err.innerText = '';
        let data = null, error = null;
        // One automatic retry for a dropped connection in a crowded room
        for (let attempt = 0; attempt < 2; attempt++) {
            ({ data, error } = await _supabase.rpc('cast_vote', { p_slug: SLUG, p_voter: voterId, p_choices: picked }));
            if (!error) break;
            await new Promise(r => setTimeout(r, 1200));
        }
        busy = false;
        if (error || !data) {
            syncBallot();
            err.innerText = 'Your vote didn\'t go through — the connection is weak. Please try again.';
            return;
        }
        if (data.ok) {
            const names = picked.map(id => (form.candidates.find(c => c.id === id) || {}).name).filter(Boolean);
            showState('ok', 'Vote confirmed!', form.success_message || 'Your vote is in. Enjoy the show!',
                `<ul class="picks">${names.map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul>`);
            buzz();
            return;
        }
        const label = (form.id_label || 'Student ID');
        if (data.error === 'already') {
            showState('ok', 'You\'ve already voted', `${label} ${voterId} has already voted. Thanks for being part of it!`);
        } else if (data.error === 'closed') {
            await load();
        } else if (data.error === 'not_on_list' || data.error === 'id') {
            renderIdStep(`That ${label} isn't eligible to vote.`);
        } else {
            // The options changed while this page was open — reload them
            await load(true);
            picked = [];
            if (form.state === 'open') renderBallot('The options were just updated. Please pick again.');
        }
    }

    load();
</script>
</body>
</html>
